name: Build & Release Android

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Next.js & Sync Capacitor Android
        run: |
          cd frontend
          npm run build
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/survivor-pool-android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: survivor-pool-android.apk

  create-release:
    name: Create GitHub Release
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            ## 🚀 survivor_pool Release v1.0.${{ github.run_number }}

            ### 📱 Téléchargements & Installation Mobile :

            - 🤖 **Android** : Téléchargez [`survivor-pool-android.apk`](./survivor-pool-android.apk) et installez-le directement sur votre smartphone Android.
            - 🍎 **iPhone / iOS** : Ouvrez le site web sur Safari, appuyez sur le bouton **Partager** ➔ **Sur l'écran d'accueil** pour installer l'application instantanément sur votre iPhone !
          files: |
            survivor-pool-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
