services:
  redis:
    image: redis:7-alpine
    container_name: survivor_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16-alpine
    container_name: survivor_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cartepro}
      POSTGRES_USER: ${POSTGRES_USER:-cartepro_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cartepro_owner} -d ${POSTGRES_DB:-cartepro}"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: survivor_backend
    command: >
      sh -c "python manage.py migrate &&
            python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  front:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: survivor_fronted
    command: >
      sh -c "npm run dev"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONT_PORT:-3000}:3000"
    env_file:
      - .env
    restart: unless-stopped

volumes:
  pgdata:
